<!DOCTYPE html>
<html lang="el" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Επιβεβαίωση Αποσύνδεσης | Traineeship Application</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">
<!-- Header (this will depend on user type) -->
<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">Traineeship Application</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <!-- Navigation Menu (will depend on user type) -->
                <ul class="navbar-nav me-auto">
                    <!-- Example navigation items (these would change based on user type) -->
                    <li class="nav-item">
                        <a class="nav-link" href="#">Αρχική</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Προφίλ</a>
                    </li>
                </ul>
                <div class="d-flex">
                        <span class="navbar-text me-3">
                            <span th:text="${user.firstName + ' ' + user.lastName}">Όνομα Χρήστη</span>
                        </span>
                    <a href="/logout" class="btn btn-outline-light btn-sm">Αποσύνδεση</a>
                </div>
            </div>
        </div>
    </nav>
</header>

<!-- Main Content -->
<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow text-center">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Αποσύνδεση</h4>
                </div>
                <div class="card-body p-4">
                    <div class="mb-4">
                        <i class="bi bi-box-arrow-right text-primary" style="font-size: 4rem;"></i>
                    </div>

                    <h5 class="mb-3">Είστε βέβαιοι ότι θέλετε να αποσυνδεθείτε;</h5>
                    <p class="text-muted mb-4">Θα χρειαστεί να συνδεθείτε ξανά για να συνεχίσετε να χρησιμοποιείτε την εφαρμογή.</p>

                    <form th:action="@{/logout}" action="/logout" method="post" class="d-inline">
                        <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>
                        <div class="d-flex justify-content-center gap-3">
                            <a href="#" onclick="window.history.back();" class="btn btn-secondary btn-lg">Ακύρωση</a>
                            <button type="submit" class="btn btn-primary btn-lg">Αποσύνδεση</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<footer class="bg-white text-center p-3 mt-5 border-top">
    <p>© 2025 Traineeship Application System</p>
</footer>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
<style>
    body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    main {
        flex: 1;
    }
</style>
</body>
</html>
